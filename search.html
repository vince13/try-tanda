<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#ff0050">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Search - Tanda Web</title>

  <link rel="icon" type="image/png" sizes="32x32" href="Tanda logo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #ff0050, #00f2ea);
      --accent-color: #00f2ea;
      --text-primary: #ffffff;
      --text-secondary: #cccccc;
      --bg-primary: #000000;
      --bg-secondary: #111111;
      --bg-card: rgba(255, 255, 255, 0.05);
      --border-radius: 1rem;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--bg-primary), var(--bg-secondary));
      color: var(--text-primary);
      min-height: 100vh;
      padding: 2rem;
    }

    .header {
      max-width: 1200px;
      margin: 0 auto 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .title {
      font-size: 1.8rem;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .search-box {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border-radius: var(--border-radius);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .search-input {
      flex: 1;
      padding: 1rem 1.5rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 0.6rem;
      color: var(--text-primary);
      font-size: 1.1rem;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent-color);
      background: rgba(255, 255, 255, 0.08);
    }

    .search-tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .search-tab {
      padding: 1rem 1.5rem;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: all 0.3s ease;
    }

    .search-tab.active {
      color: var(--accent-color);
      border-bottom-color: var(--accent-color);
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .result-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border-radius: var(--border-radius);
      border: 1px solid rgba(255,255,255,0.1);
      overflow: hidden;
      transition: transform 0.3s ease;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .result-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-color);
    }

    .result-image {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: rgba(255,255,255,0.05);
    }

    .result-info {
      padding: 1.5rem;
    }

    .result-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .result-meta {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.5rem;
    }

    .user-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .user-info {
      flex: 1;
    }

    .user-name {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .user-stats {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .trending-section {
      margin-top: 3rem;
    }

    .trending-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .trending-tag {
      padding: 0.5rem 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 2rem;
      color: var(--text-primary);
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .trending-tag:hover {
      background: var(--primary-gradient);
      border-color: transparent;
    }

    .loading {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-secondary);
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-secondary);
    }

    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }

      .title {
        font-size: 1.5rem;
      }

      .search-box {
        flex-direction: column;
        padding: 1rem;
      }

      .search-input {
        width: 100%;
        font-size: 1rem;
      }

      .search-tabs {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        gap: 0.5rem;
      }

      .search-tab {
        white-space: nowrap;
        padding: 0.75rem 1rem;
        font-size: 0.9rem;
      }

      .results-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }

      .card {
        padding: 1.5rem;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 0.75rem;
      }

      .title {
        font-size: 1.3rem;
      }

      .search-box {
        padding: 0.75rem;
      }

      .card {
        padding: 1rem;
      }
    }
  </style>
</head>
<body data-tanda-page-label="Search – creators, tags, and products.">
  <div class="header">
    <h1 class="title">Search</h1>
    <div class="nav" id="authNav"></div>
  </div>

  <div class="container">
    <div class="search-box">
      <input type="text" 
             class="search-input" 
             id="search-input" 
             placeholder="Search videos, users, products..."
             onkeyup="handleSearch(event)">
      <button class="btn" onclick="performSearch()" style="padding: 1rem 2rem;">
        <i class="fas fa-search"></i> Search
      </button>
    </div>

    <div class="search-tabs">
      <button type="button" class="search-tab active" data-tab="all" onclick="switchTab('all')">All</button>
      <button type="button" class="search-tab" data-tab="videos" onclick="switchTab('videos')">Videos</button>
      <button type="button" class="search-tab" data-tab="users" onclick="switchTab('users')">Users</button>
      <button type="button" class="search-tab" data-tab="products" onclick="switchTab('products')">Products</button>
    </div>

    <div id="results-section" style="display: none;">
      <div class="results-grid" id="results-grid"></div>
    </div>

    <div id="popular-section" class="trending-section" style="display: none;">
      <h2 style="margin-bottom: 1rem; color: var(--accent-color);">Popular searches</h2>
      <p style="color: var(--text-secondary); font-size: 0.9rem; margin: -0.5rem 0 1rem;">From Tanda discovery – same idea as the app home search.</p>
      <div class="trending-tags" id="popular-queries"></div>
    </div>

    <div id="trending-section" class="trending-section" style="display: none;">
      <h2 style="margin-bottom: 1rem; color: var(--accent-color);">Trending hashtags</h2>
      <div class="trending-tags" id="trending-tags"></div>
    </div>

    <div id="loading-section" class="loading" style="display: none;">
      <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 1rem;"></i>
      <p>Searching...</p>
    </div>

    <div id="empty-section" class="empty-state" style="display: block;">
      <i class="fas fa-search" style="font-size: 4rem; margin-bottom: 1rem; opacity: 0.3;"></i>
      <p>Enter a search term to get started</p>
    </div>
  </div>

  <script src="js/super-affiliate-api.js?v=31"></script>
  <script src="js/tanda-shopping-assistant.js?v=4"></script>
  <script>
    let currentTab = 'all';
    let searchTimeout = null;

    // Render auth nav
    SuperAffiliateAPI.renderAuthNav('authNav');

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.search-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tab);
      });

      const query = document.getElementById('search-input').value;
      if (query.trim()) {
        performSearch();
      }
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function normalizeVideoResult(v) {
      if (!v) return null;
      const id = v.id;
      if (id == null) return null;
      return {
        id,
        thumbnail_url: v.thumbnail_url || v.thumbnail || '',
        title: v.title || v.caption || v.description || 'Video',
        likes: v.likes_count ?? v.likes ?? 0,
        username: v.user?.username || v.creator_username || v.uploaded_by?.username || 'user',
      };
    }

    function handleSearch(event) {
      if (event.key === 'Enter') {
        performSearch();
        return;
      }

      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        const query = document.getElementById('search-input').value;
        if (query.length >= 3) {
          performSearch();
        } else if (query.length === 0) {
          document.getElementById('results-section').style.display = 'none';
          document.getElementById('empty-section').style.display = 'block';
        }
      }, 500);
    }

    async function performSearch() {
      const query = document.getElementById('search-input').value.trim();
      
      if (!query) {
        document.getElementById('empty-section').style.display = 'block';
        document.getElementById('results-section').style.display = 'none';
        document.getElementById('empty-section').innerHTML = '<i class="fas fa-search" style="font-size: 4rem; margin-bottom: 1rem; opacity: 0.3;"></i><p>Enter a search term to get started</p>';
        return;
      }

      document.getElementById('loading-section').style.display = 'block';
      document.getElementById('results-section').style.display = 'none';
      document.getElementById('empty-section').style.display = 'none';

      try {
        let results = [];

        if (currentTab === 'all' || currentTab === 'videos') {
          try {
            const videoResponse = await SuperAffiliateAPI.unifiedVideoSearch(query, 'videos', 1);
            const videos = videoResponse.videos || videoResponse.results || [];
            for (const v of videos) {
              const n = normalizeVideoResult(v);
              if (n) results.push({ type: 'video', data: n });
            }
          } catch (error) {
            console.error('Video search error:', error);
          }
        }

        if (currentTab === 'all' || currentTab === 'users') {
          try {
            const userResponse = await SuperAffiliateAPI.unifiedVideoSearch(query, 'users', 1);
            let users = userResponse.users || [];
            if (!users.length) {
              const fallback = await SuperAffiliateAPI.searchUsers(query);
              users = fallback.results || fallback.users || [];
            }
            results = results.concat(users.map(u => ({ type: 'user', data: u })));
          } catch (error) {
            console.error('User search error:', error);
            try {
              const fallback = await SuperAffiliateAPI.searchUsers(query);
              const users = fallback.results || fallback.users || [];
              results = results.concat(users.map(u => ({ type: 'user', data: u })));
            } catch (_) {}
          }
        }

        if (currentTab === 'all' || currentTab === 'products') {
          try {
            const productResponse = await SuperAffiliateAPI.apiRequest(`/commerce/products/?search=${encodeURIComponent(query)}`);
            const products = productResponse.results || productResponse.products || [];
            results = results.concat(products.map(p => ({ type: 'product', data: p })));
          } catch (error) {
            console.error('Product search error:', error);
          }
        }

        displayResults(results);
      } catch (error) {
        console.error('Search error:', error);
        document.getElementById('empty-section').style.display = 'block';
        document.getElementById('empty-section').innerHTML =
          '<i class="fas fa-exclamation-circle" style="font-size: 3rem; margin-bottom: 1rem; opacity: 0.4;"></i><p>Search failed. Please try again.</p>';
      } finally {
        document.getElementById('loading-section').style.display = 'none';
      }
    }

    function displayResults(results) {
      document.getElementById('loading-section').style.display = 'none';

      if (results.length === 0) {
        document.getElementById('empty-section').style.display = 'block';
        document.getElementById('empty-section').innerHTML =
          '<i class="fas fa-search" style="font-size: 4rem; margin-bottom: 1rem; opacity: 0.3;"></i><p>No results for this tab. Try another category or query.</p>';
        return;
      }

      document.getElementById('results-section').style.display = 'block';
      const grid = document.getElementById('results-grid');

      grid.innerHTML = results.map(result => {
        if (result.type === 'video') {
          const v = result.data;
          const titleEsc = escapeHtml(v.title || 'Video');
          const userEsc = escapeHtml(v.username || 'user');
          return `
            <a href="feed.html?video=${encodeURIComponent(v.id)}" class="result-card">
              <img src="${escapeHtml(v.thumbnail_url || '')}" alt="" class="result-image" onerror="this.style.display='none';">
              <div class="result-info">
                <div class="result-title">${titleEsc}</div>
                <div class="result-meta">@${userEsc} • ${v.likes || 0} likes</div>
              </div>
            </a>
          `;
        } else if (result.type === 'user') {
          const u = result.data;
          const uname = u.username != null ? String(u.username) : '';
          if (!uname) return '';
          const avatarUrl = u.avatar || u.avatar_url || '';
          const displayNameRaw = u.first_name && u.last_name
            ? `${u.first_name} ${u.last_name}`
            : uname;
          const displayName = escapeHtml(displayNameRaw);
          const bioHtml = u.bio ? `<div class="user-bio" style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.25rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${escapeHtml(u.bio)}</div>` : '';
          const avatarSafe = avatarUrl && /^https?:\/\//i.test(String(avatarUrl))
            ? escapeHtml(avatarUrl)
            : '';
          return `
            <a href="user-profile.html?username=${encodeURIComponent(uname)}" class="result-card user-card">
              <div class="user-avatar" style="${avatarSafe ? `background-image: url('${avatarSafe}'); background-size: cover; background-position: center;` : ''}">
                ${!avatarSafe ? '<i class="fas fa-user"></i>' : ''}
              </div>
              <div class="user-info">
                <div class="user-name">${displayName}</div>
                <div class="user-stats">@${escapeHtml(uname)} • ${u.total_followers || 0} followers</div>
                ${bioHtml}
              </div>
            </a>
          `;
        } else if (result.type === 'product') {
          const p = result.data;
          const pid = p.id;
          if (pid == null) return '';
          const nameEsc = escapeHtml(p.name || 'Product');
          const img = escapeHtml(p.image || p.thumbnail || '');
          return `
            <a href="product-detail.html?id=${encodeURIComponent(pid)}" class="result-card">
              <img src="${img}" alt="" class="result-image" onerror="this.style.display='none';">
              <div class="result-info">
                <div class="result-title">${nameEsc}</div>
                <div class="result-meta">₦${parseFloat(p.price || 0).toLocaleString('en-NG')}</div>
              </div>
            </a>
          `;
        }
        return '';
      }).filter(Boolean).join('');
    }

    function fillTagContainer(containerEl, tags, maxItems) {
      if (!containerEl) return;
      containerEl.innerHTML = '';
      tags.slice(0, maxItems).forEach((tag) => {
        const s = String(tag || '').trim();
        if (!s) return;
        const a = document.createElement('a');
        a.href = '#';
        a.className = 'trending-tag';
        a.textContent = s;
        a.addEventListener('click', (e) => {
          e.preventDefault();
          searchTag(s);
        });
        containerEl.appendChild(a);
      });
    }

    async function loadTrendingFromVideosFallback() {
      try {
        const response = await SuperAffiliateAPI.apiRequest('/videos/trending/?page=1');
        const videos = response.results || response.videos || [];
        const tags = new Set();
        videos.slice(0, 15).forEach((v) => {
          const caption = v.caption || v.title || v.description || '';
          const hashtags = caption.match(/#\w+/g) || [];
          hashtags.forEach((tag) => tags.add(tag));
        });
        if (tags.size > 0) {
          document.getElementById('trending-section').style.display = 'block';
          const el = document.getElementById('trending-tags');
          fillTagContainer(el, Array.from(tags), 12);
        }
      } catch (error) {
        console.error('Error loading trending fallback:', error);
      }
    }

    async function loadSearchDiscovery() {
      try {
        const raw = await SuperAffiliateAPI.getSearchDiscovery();
        const hashtags = Array.isArray(raw.trending_hashtags) ? raw.trending_hashtags : [];
        const popular = Array.isArray(raw.popular_queries) ? raw.popular_queries : [];

        if (popular.length > 0) {
          document.getElementById('popular-section').style.display = 'block';
          fillTagContainer(document.getElementById('popular-queries'), popular, 10);
        }

        if (hashtags.length > 0) {
          document.getElementById('trending-section').style.display = 'block';
          fillTagContainer(document.getElementById('trending-tags'), hashtags, 12);
        }

        if (!hashtags.length && !popular.length) {
          await loadTrendingFromVideosFallback();
        }
      } catch (error) {
        console.error('Error loading search discovery:', error);
        await loadTrendingFromVideosFallback();
      }
    }

    function searchTag(tag) {
      document.getElementById('search-input').value = tag;
      performSearch();
    }

    loadSearchDiscovery();
  </script>
</body>
</html>
