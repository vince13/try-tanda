<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#030712">
  <title>Instant checkout — Tanda</title>
  <link rel="icon" type="image/png" sizes="32x32" href="Tanda logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --accent: #00f2ea;
      --grad: linear-gradient(135deg, #ff0050, #00f2ea);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body.instant-page {
      height: 100%;
      overflow: hidden;
      font-family: Inter, system-ui, sans-serif;
      background: #030712;
      color: #fff;
    }
    .instant-chrome {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 12px;
      padding-left: calc(12px + env(safe-area-inset-left, 0px));
      padding-right: calc(12px + env(safe-area-inset-right, 0px));
      background: linear-gradient(180deg, rgba(3,7,18,0.82), rgba(3,7,18,0.25));
      pointer-events: none;
    }
    .instant-chrome > * { pointer-events: auto; }
    .instant-chrome a, .instant-chrome button {
      color: #fff;
      text-decoration: none;
      background: rgba(255,255,255,0.12);
      border: none;
      border-radius: 10px;
      padding: 0.35rem 0.65rem;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .instant-chrome .instant-title {
      font-weight: 800;
      font-size: 1rem;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      flex: 1;
      text-align: center;
      pointer-events: none;
    }
    .instant-chrome .instant-counter {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.65);
      min-width: 3rem;
      text-align: right;
    }
    #authNav { pointer-events: auto; transform: scale(0.92); transform-origin: right center; max-width: 50%; }

    .instant-reel {
      height: 100dvh;
      height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      scrollbar-width: none;
    }
    .instant-reel::-webkit-scrollbar { display: none; }

    /* One slide = one phone column (Flutter-style), centered on desktop */
    .instant-slide {
      height: 100dvh;
      height: 100vh;
      min-height: -webkit-fill-available;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(52px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px));
      background:
        radial-gradient(ellipse 80% 60% at 50% 40%, rgba(255,0,80,0.08), transparent 60%),
        radial-gradient(ellipse 70% 50% at 50% 80%, rgba(0,242,234,0.06), transparent 55%),
        #02050c;
    }

    /* Phone stage: same class of footprint as TikTok web / feed `.stage` */
    .instant-phone {
      position: relative;
      width: min(420px, 92vw);
      height: min(88dvh, 900px);
      max-height: calc(100svh - 120px);
      max-height: calc(100vh - 120px);
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow:
        0 4px 0 rgba(255,255,255,0.04) inset,
        0 28px 80px rgba(0,0,0,0.75);
      background: #000;
      isolation: isolate;
    }

    .instant-stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .instant-stage .slide-poster {
      position: absolute;
      inset: 0;
      background: center/cover no-repeat;
      z-index: 0;
    }
    .instant-stage .slide-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .instant-stage .slide-shade {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(
        180deg,
        rgba(0,0,0,0.42) 0%,
        transparent 28%,
        transparent 52%,
        rgba(0,0,0,0.7) 100%
      );
      pointer-events: none;
    }

    .instant-stage .slide-ui {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 3;
      padding: 1rem 1rem 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      max-width: 100%;
      pointer-events: auto;
    }

    .badge-row { display: flex; gap: 0.35rem; flex-wrap: wrap; }
    .badge-row span {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.2rem 0.45rem;
      border-radius: 6px;
      background: rgba(0,0,0,0.55);
      color: var(--accent);
    }
    .slide-ui h2 {
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.2;
      text-shadow: 0 2px 14px rgba(0,0,0,0.65);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .slide-ui .seller { font-size: 0.8rem; color: rgba(255,255,255,0.78); }
    .slide-ui .price { font-size: 1rem; font-weight: 800; color: var(--accent); }
    .slide-actions { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.25rem; }
    .slide-actions a, .slide-actions button {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 0.85rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
      text-decoration: none;
    }
    .slide-actions .btn-primary {
      background: var(--grad);
      color: #061018;
    }
    .slide-actions .btn-ghost {
      background: rgba(255,255,255,0.14);
      color: #fff;
    }

    .instant-status {
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.75rem;
      color: rgba(255,255,255,0.6);
      padding: 2rem;
      text-align: center;
    }
    .instant-status.err { color: #ff9b9b; }
  </style>
</head>
<body class="instant-page" data-tanda-page-label="Instant — vertical feed; open watch for checkout.">
  <div class="instant-chrome">
    <a href="feed.html" id="backInstant" title="Back" aria-label="Back to previous page"><i class="fas fa-arrow-left"></i></a>
    <button type="button" id="btnRefresh" title="Reload feed"><i class="fas fa-rotate"></i></button>
    <span class="instant-title">Instant</span>
    <span class="instant-counter" id="slideCounter"></span>
    <div id="authNav" data-nav-mode="instant_shop"></div>
  </div>

  <main class="instant-reel" id="reel" aria-label="Instant vertical feed"></main>

  <script src="js/super-affiliate-api.js?v=30"></script>
  <script src="js/tanda-shopping-assistant.js?v=4"></script>
  <script>
    SuperAffiliateAPI.renderAuthNav('authNav');
    if (typeof SuperAffiliateAPI.updateCartBadge === 'function') SuperAffiliateAPI.updateCartBadge();

    const siteRoot = SuperAffiliateAPI.getPathToSiteRoot();
    const backEl = document.getElementById('backInstant');
    const feedFallback = siteRoot + 'feed.html';
    if (backEl) {
      backEl.href = feedFallback;
      backEl.addEventListener('click', function (e) {
        e.preventDefault();
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = feedFallback;
        }
      });
    }

    const reel = document.getElementById('reel');
    const counter = document.getElementById('slideCounter');

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /** Canonical watch URL for sharing / link previews (no auth hash). */
    function publicWatchHref(item) {
      let base = (item.watch_url || '').trim();
      const hashIdx = base.indexOf('#');
      if (hashIdx >= 0) base = base.slice(0, hashIdx);
      if (base) {
        if (base.startsWith('/') && SuperAffiliateAPI.getBackendOrigin()) {
          base = SuperAffiliateAPI.getBackendOrigin() + base;
        }
      } else {
        base = SuperAffiliateAPI.getInstantWatchPageUrl(item.slug, item.media_type);
      }
      return base;
    }

    function watchHref(item) {
      let base = (item.watch_url || '').trim();
      if (base) {
        if (base.startsWith('/') && SuperAffiliateAPI.getBackendOrigin()) {
          base = SuperAffiliateAPI.getBackendOrigin() + base;
        }
      } else {
        base = SuperAffiliateAPI.getInstantWatchPageUrl(item.slug, item.media_type);
      }
      return typeof SuperAffiliateAPI.appendInstantAuthTransferHash === 'function'
        ? SuperAffiliateAPI.appendInstantAuthTransferHash(base)
        : base;
    }

    function productPrice(p) {
      if (!p) return '';
      const n = Number(p.price);
      if (Number.isFinite(n)) return '₦' + Math.round(n).toLocaleString();
      return p.price != null ? esc(String(p.price)) : '';
    }

    function buildSlide(item, idx, total) {
      const href = watchHref(item);
      const shareUrl = publicWatchHref(item);
      const mtype = (item.media_type || '').toString().toLowerCase();
      const isVideo = mtype === 'video';
      const cover = item.cover_url || '';
      const mediaUrl = (item.video_url || item.media_url || '').toString();
      const p = item.product;
      const title = (p && p.name) || item.title || 'Instant';
      const seller = item.seller_label || (item.seller && item.seller.label) || '';
      const pprice = productPrice(p);
      const badge = isVideo ? 'Video' : 'Image';
      const detail = p && p.id ? `${siteRoot}product-detail.html?id=${encodeURIComponent(p.id)}` : '';

      let mediaHtml;
      if (isVideo && mediaUrl) {
        const poster = cover ? ` poster="${esc(cover)}"` : '';
        mediaHtml = `
          <div class="slide-poster" style="background-image:url('${esc(cover)}')" aria-hidden="true"></div>
          <video class="slide-video" muted loop playsinline preload="metadata"${poster} data-slide-idx="${idx}">
            <source src="${esc(mediaUrl)}">
          </video>`;
      } else {
        const bg = cover || mediaUrl;
        mediaHtml = `<div class="slide-poster" style="background-image:url('${esc(bg)}')" role="img" aria-label=""></div>`;
      }

      return `
        <section class="instant-slide" data-slide="${idx}" aria-label="Instant ${idx + 1} of ${total}">
          <div class="instant-phone">
            <div class="instant-stage">
              ${mediaHtml}
              <div class="slide-shade"></div>
              <div class="slide-ui">
                <div class="badge-row"><span>${esc(badge)}</span>${pprice ? `<span>${esc(pprice)}</span>` : ''}</div>
                <h2>${esc(title)}</h2>
                ${seller ? `<div class="seller"><i class="fas fa-user-tag"></i> ${esc(seller)}</div>` : ''}
                <div class="slide-actions">
                  <a class="btn-primary" href="${esc(href)}" target="_blank" rel="noopener noreferrer"><i class="fas fa-bolt"></i> Watch & checkout</a>
                  ${detail ? `<a class="btn-ghost" href="${esc(detail)}">Product</a>` : ''}
                  ${shareUrl ? `<button type="button" class="btn-ghost share-instant-btn" data-share-url="${esc(shareUrl)}" data-share-title="${esc(title)}" data-share-price="${esc(pprice)}"><i class="fas fa-share-nodes"></i> Share</button>` : ''}
                </div>
              </div>
            </div>
          </div>
        </section>`;
    }

    let videoIo = null;
    function wireVideos() {
      if (videoIo) videoIo.disconnect();
      videoIo = new IntersectionObserver(
        (entries) => {
          entries.forEach((e) => {
            const v = e.target;
            if (!(v instanceof HTMLVideoElement)) return;
            if (e.isIntersecting) v.play().catch(() => {});
            else v.pause();
          });
        },
        { root: reel, threshold: 0.42 }
      );
      reel.querySelectorAll('video.slide-video').forEach((v) => videoIo.observe(v));
    }

    function updateCounter() {
      const slides = reel.querySelectorAll('.instant-slide');
      if (!slides.length) {
        counter.textContent = '';
        return;
      }
      const h = reel.clientHeight || window.innerHeight;
      const i = Math.min(slides.length - 1, Math.max(0, Math.round(reel.scrollTop / Math.max(h * 0.98, 1))));
      counter.textContent = `${i + 1}/${slides.length}`;
    }

    let scrollIdle;
    reel.addEventListener('scroll', () => {
      updateCounter();
      clearTimeout(scrollIdle);
      scrollIdle = setTimeout(updateCounter, 60);
    }, { passive: true });

    reel.addEventListener('click', async (e) => {
      const btn = e.target && e.target.closest && e.target.closest('.share-instant-btn');
      if (!btn) return;
      e.preventDefault();
      const url = btn.getAttribute('data-share-url');
      if (!url) return;
      const title = btn.getAttribute('data-share-title') || 'Tanda instant checkout';
      const price = btn.getAttribute('data-share-price') || '';
      const text = price ? `${title} — ${price}` : title;
      if (navigator.share) {
        try {
          await navigator.share({ title, text, url });
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
      }
      try {
        await navigator.clipboard.writeText(url);
        const prev = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-check"></i> Copied';
        setTimeout(() => {
          btn.innerHTML = prev;
        }, 1600);
      } catch (_) {
        window.prompt('Copy link:', url);
      }
    });

    async function loadFeed() {
      counter.textContent = '';
      reel.innerHTML = '<div class="instant-status"><i class="fas fa-spinner fa-spin fa-2x"></i> Loading…</div>';
      try {
        const data = await SuperAffiliateAPI.fetchInstantPublicFeed(40);
        const results = (data && data.results) || [];
        if (!results.length) {
          reel.innerHTML = '<div class="instant-status">No instant listings yet.</div>';
          return;
        }
        const total = results.length;
        reel.innerHTML = results.map((item, idx) => buildSlide(item, idx, total)).join('');
        wireVideos();
        updateCounter();
      } catch (e) {
        reel.innerHTML = `<div class="instant-status err">${esc(e.message || 'Could not load feed.')}</div>`;
      }
    }

    document.getElementById('btnRefresh').addEventListener('click', () => loadFeed());
    window.addEventListener('resize', updateCounter);

    loadFeed();
  </script>
</body>
</html>
